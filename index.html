<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="通过订单相关信息查询快递物流单号。" />
    <title>快递订单查询</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b3b60'/%3E%3Cpath d='M6 10h13v11H6zM19 14h4l3 3v4h-7z' fill='%23d7efff'/%3E%3Ccircle cx='11' cy='23' r='2.5' fill='%23ffbd4a'/%3E%3Ccircle cx='22' cy='23' r='2.5' fill='%23ffbd4a'/%3E%3C/svg%3E" />
    <style>
      :root { --ink: #102d45; --muted: #627789; --line: #d7e2ea; --blue: #075985; --blue-dark: #063b60; --sky: #eaf6fc; --amber: #ffbd4a; --paper: #f5f8fa; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; background: var(--paper); color: var(--ink); font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
      main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 64px; }
      .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
      .mark { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; background: var(--blue-dark); color: white; font-size: 21px; }
      .brand strong { display: block; font-size: 18px; letter-spacing: .02em; }
      .brand span { display: block; margin-top: 3px; color: var(--muted); font-size: 13px; }
      .panel { background: white; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 18px 50px rgba(19, 55, 80, .08); overflow: hidden; }
      .query { padding: 36px; background: linear-gradient(125deg, #083f64 0%, #075985 62%, #1074a4 100%); color: white; }
      h1 { margin: 0; font-size: clamp(26px, 4vw, 38px); letter-spacing: .02em; }
      .intro { max-width: 640px; margin: 10px 0 26px; color: #d7efff; font-size: 16px; line-height: 1.7; }
      .search-row { display: flex; gap: 10px; }
      .search-row input { flex: 1; min-width: 0; border: 0; border-radius: 10px; padding: 15px 16px; font: inherit; color: var(--ink); outline: 3px solid transparent; }
      .search-row input:focus, .filters input:focus { outline-color: rgba(255, 189, 74, .8); }
      button { border: 0; border-radius: 10px; padding: 0 20px; min-height: 50px; cursor: pointer; font: inherit; font-weight: 700; }
      .search-btn { background: var(--amber); color: #543300; }
      .search-btn:hover { background: #ffd171; }
      .filters { padding: 28px 36px 32px; border-bottom: 1px solid var(--line); }
      .filter-top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 18px; }
      h2 { margin: 0; font-size: 17px; }
      .filter-tip { margin: 0; color: var(--muted); font-size: 13px; }
      .filter-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
      label { display: grid; gap: 7px; color: #3b5265; font-size: 14px; font-weight: 700; }
      .filters input { width: 100%; min-width: 0; padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); font: 15px inherit; outline: 3px solid transparent; }
      .results { padding: 28px 36px 36px; }
      .result-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
      .result-header p { margin: 0; color: var(--muted); font-size: 14px; }
      .clear { min-height: auto; padding: 6px 0; background: transparent; color: var(--blue); font-size: 14px; }
      .clear:hover { text-decoration: underline; }
      .result-list { display: grid; gap: 12px; }
      .order { display: grid; grid-template-columns: 1.2fr .9fr 1.2fr; gap: 16px; padding: 18px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
      .datum { min-width: 0; }
      .datum small { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; }
      .datum strong { display: block; overflow-wrap: anywhere; font-size: 16px; line-height: 1.45; }
      .tracking strong { color: var(--blue); letter-spacing: .03em; }
      .empty { padding: 32px 18px; border: 1px dashed #b9cbd6; border-radius: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
      .note { margin: 24px 4px 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
      @media (max-width: 720px) { main { width: min(100% - 24px, 1120px); padding-top: 24px; } .query, .filters, .results { padding: 24px 20px; } .search-row { flex-direction: column; } .filter-grid { grid-template-columns: 1fr; } .order { grid-template-columns: 1fr; gap: 13px; } .filter-top { align-items: flex-start; flex-direction: column; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="快递订单查询">
        <div class="mark" aria-hidden="true">▣</div>
        <div><strong>快递订单查询</strong><span>物流订单信息检索</span></div>
      </div>
      <section class="panel" aria-labelledby="page-title">
        <div class="query">
          <h1 id="page-title">查询物流订单号</h1>
          <p class="intro">输入姓名、电话、地址、订单号、快递公司或物流单号中的任意信息，即可查找对应订单。</p>
          <div class="search-row">
            <input id="keyword" type="search" autocomplete="off" placeholder="例如：姓名、订单号或电话" aria-label="关键词搜索" />
            <button class="search-btn" id="searchButton" type="button">开始查询</button>
          </div>
        </div>
        <div class="filters">
          <div class="filter-top"><h2>精确筛选</h2><p class="filter-tip">可填写一个或多个条件，支持输入部分内容。</p></div>
          <div class="filter-grid">
            <label>姓名<input data-field="name" type="text" autocomplete="off" placeholder="输入姓名" /></label>
            <label>电话<input data-field="phone" type="text" inputmode="tel" autocomplete="off" placeholder="输入电话号码" /></label>
            <label>地址<input data-field="address" type="text" autocomplete="off" placeholder="输入地址关键词" /></label>
            <label>订单号<input data-field="orderNo" type="text" inputmode="numeric" autocomplete="off" placeholder="输入订单号" /></label>
            <label>快递公司<input data-field="carrier" type="text" autocomplete="off" placeholder="输入快递公司" /></label>
            <label>物流单号<input data-field="trackingNo" type="text" autocomplete="off" placeholder="输入物流单号" /></label>
          </div>
        </div>
        <div class="results" aria-live="polite">
          <div class="result-header"><p id="summary">已显示全部 1 条订单</p><button class="clear" id="clearButton" type="button">清空条件</button></div>
          <div class="result-list" id="resultList"></div>
        </div>
      </section>
      <p class="note">数据来源：原始数据 快递查询.xlsx。为保护信息安全，请仅在授权范围内使用本页面。</p>
    </main>
    <script>
      // 将新记录按相同字段补充到这里，即可扩展本地查询数据。
      const orders = [
        { name: "谢大侠", phone: "17755558974", address: "广东省深圳市南山区牛逼街道超级大厦111", orderNo: "123654789987455", carrier: "顺达", trackingNo: "SD9526478113" }
      ];
      const labels = { name: "姓名", phone: "电话", address: "地址", orderNo: "订单号", carrier: "快递公司", trackingNo: "物流单号" };
      const keyword = document.querySelector('#keyword');
      const filters = [...document.querySelectorAll('[data-field]')];
      const resultList = document.querySelector('#resultList');
      const summary = document.querySelector('#summary');

      function includes(value, term) { return String(value).toLowerCase().includes(term.toLowerCase().trim()); }
      function matches(order) {
        const term = keyword.value.trim();
        const keywordMatch = !term || Object.values(order).some(value => includes(value, term));
        const filtersMatch = filters.every(input => !input.value.trim() || includes(order[input.dataset.field], input.value));
        return keywordMatch && filtersMatch;
      }
      function card(order) {
        return `<article class="order"><div class="datum"><small>订单号</small><strong>${order.orderNo}</strong></div><div class="datum"><small>快递公司</small><strong>${order.carrier}</strong></div><div class="datum tracking"><small>物流单号</small><strong>${order.trackingNo}</strong></div></article>`;
      }
      function render() {
        const found = orders.filter(matches);
        summary.textContent = found.length ? `找到 ${found.length} 条匹配订单` : '未找到匹配订单';
        resultList.innerHTML = found.length ? found.map(card).join('') : '<div class="empty">没有匹配的订单。请检查输入内容，或减少筛选条件后再试。</div>';
      }
      document.querySelector('#searchButton').addEventListener('click', render);
      document.querySelector('#clearButton').addEventListener('click', () => { keyword.value = ''; filters.forEach(input => input.value = ''); render(); keyword.focus(); });
      keyword.addEventListener('keydown', event => { if (event.key === 'Enter') render(); });
      filters.forEach(input => input.addEventListener('input', render));
      render();
    </script>
  </body>
</html>
